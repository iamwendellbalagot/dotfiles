# --- Terminal / colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",*:clipboard" # OSC 52 clipboard support (WezTerm)
set -g focus-events on

# --- General ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10 # fast Escape for vim
set -g base-index 1 # windows start at 1
setw -g pane-base-index 1 # panes start at 1
set -g renumber-windows on
set -g set-clipboard on
setw -g automatic-rename on
set -g status-position bottom

# --- Keybindings ---
# Split with | and - matching a window pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Quick window switching
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# --- Statusline (JetBrains Mono friendly) ---
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[bold,fg=colour39]#S #[default] "
set -g status-right "%H:%M  %d-%b "
setw -g window-status-format " #I #W "
setw -g window-status-current-style "fg=colour39,bold"
setw -g window-status-current-format " #I #W* "
setw -g window-status-separator ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
